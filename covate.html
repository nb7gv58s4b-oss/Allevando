<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Covate - Allevando</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-inner: #0f172a;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #22c55e;
      --accent-hover: #16a34a;
      --border: #334155;
      --danger: #ef4444;
      --warning: #f59e0b;
      --info: #3b82f6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 20px;
      line-height: 1.5;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
    }

    h1 {
      font-size: 1.5rem;
      color: var(--text);
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 24px;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 16px;
      color: var(--text);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    @media (min-width: 640px) {
      .grid-2 {
        grid-template-columns: 1fr 1fr;
      }
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 6px;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px;
      background-color: var(--card-inner);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 0.95rem;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
    }

    .btn {
      background-color: var(--accent);
      color: #000;
      font-weight: 600;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.95rem;
      transition: background-color 0.2s;
    }

    .btn:hover {
      background-color: var(--accent-hover);
    }

    .btn-secondary {
      background-color: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }

    .btn-secondary:hover {
      background-color: var(--border);
    }

    .btn-danger {
      background-color: var(--danger);
      color: #fff;
    }

    .btn-small {
      padding: 6px 12px;
      font-size: 0.8rem;
    }

    /* Struttura lista uova dinamica */
    .egg-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 16px;
    }

    .egg-row {
      display: grid;
      grid-template-columns: 80px 1fr 1fr 1fr;
      gap: 12px;
      align-items: center;
      background: var(--card-inner);
      padding: 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    @media (max-width: 640px) {
      .egg-row {
        grid-template-columns: 1fr;
      }
    }

    .egg-number {
      font-weight: bold;
      color: var(--accent);
    }

    .egg-hatch {
      display: none;
    }

    .egg-hatch.visible {
      display: block;
    }

    /* Lista covate memorizzate */
    .covata-item {
      background-color: var(--card-inner);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .covata-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }

    .egg-badge-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .egg-badge {
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 0.8rem;
      background: var(--card-bg);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge-In-attesa { border-left: 3px solid var(--warning); }
    .badge-Fertile { border-left: 3px solid var(--info); }
    .badge-Chiaro { border-left: 3px solid var(--muted); }
    .badge-Rotto, .badge-Perso { border-left: 3px solid var(--danger); }
    .badge-Schiuso { border-left: 3px solid var(--accent); }

    /* Modal per Creazione Soggetto */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }

    .modal-overlay.show {
      display: flex;
    }

    .modal {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      width: 100%;
      max-width: 500px;
      padding: 20px;
    }

    .status-message {
      margin-top: 10px;
      padding: 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      display: none;
    }

    .status-message.success {
      display: block;
      background: rgba(34, 197, 94, 0.2);
      color: var(--accent);
      border: 1px solid var(--accent);
    }

    .status-message.error {
      display: block;
      background: rgba(239, 68, 68, 0.2);
      color: var(--danger);
      border: 1px solid var(--danger);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Gestione Covate</h1>
      <a href="index.html" class="btn btn-secondary">← Torna alla Dashboard</a>
    </header>

    <!-- FORM INSERIMENTO COVATA -->
    <div class="card">
      <div class="card-title">Nuova Covata</div>
      <form id="covataForm">
        <div class="grid-2">
          <div class="form-group">
            <label for="coppiaSelect">Coppia *</label>
            <select id="coppiaSelect" required>
              <option value="">Caricamento coppie...</option>
            </select>
          </div>

          <div class="form-group">
            <label for="numeroUova">Numero Uova *</label>
            <input type="number" id="numeroUova" min="1" max="15" value="1" required />
          </div>
        </div>

        <div class="form-group">
          <label>Dettaglio Uova</label>
          <div id="eggList" class="egg-list"></div>
        </div>

        <div class="form-group">
          <label for="noteCovata">Note della covata</label>
          <textarea id="noteCovata" rows="2" placeholder="Note facoltative..."></textarea>
        </div>

        <button type="submit" class="btn">Salva Covata</button>
      </form>
    </div>

    <!-- ELENCO COVATE -->
    <div class="card">
      <div class="card-title">Storico Covate</div>
      <div id="covateContainer">Caricamento in corso...</div>
    </div>
  </div>

  <!-- MODALE PER CREARE IL SOGGETTO DA UOVO SCHIUSO -->
  <div id="subjectModal" class="modal-overlay">
    <div class="modal">
      <div class="card-title">Aggiungi Soggetto da Schiusa</div>
      <form id="subjectForm">
        <input type="hidden" id="subjectEggId" />

        <div class="form-group">
          <label for="subjectCodice">Codice / RNA / Anello *</label>
          <input type="text" id="subjectCodice" required placeholder="Es. ABC-123" />
        </div>

        <div class="form-group">
          <label for="subjectSpecie">Specie *</label>
          <input type="text" id="subjectSpecie" required placeholder="Es. Canarino, Diamante Mandarino" />
        </div>

        <div class="grid-2">
          <div class="form-group">
            <label for="subjectSesso">Sesso</label>
            <select id="subjectSesso">
              <option value="Sconosciuto">Sconosciuto</option>
              <option value="M">Maschio</option>
              <option value="F">Femmina</option>
            </select>
          </div>

          <div class="form-group">
            <label for="subjectData">Data Nascita</label>
            <input type="date" id="subjectData" />
          </div>
        </div>

        <div id="subjectMessage" class="status-message"></div>

        <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px;">
          <button type="button" class="btn btn-secondary" onclick="closeSubjectModal()">Annulla</button>
          <button type="submit" class="btn">Crea e Collega</button>
        </div>
      </form>
    </div>
  </div>

  <!-- SUPABASE JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // Configurazione Supabase (inserisci i tuoi valori se non configurati globalmente)
    const SUPABASE_URL = "https://your-supabase-url.supabase.co";
    const SUPABASE_KEY = "your-anon-key";
    const db = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

    // Elementi DOM
    const coppiaSelect = document.getElementById("coppiaSelect");
    const numeroUova = document.getElementById("numeroUova");
    const eggList = document.getElementById("eggList");
    const covataForm = document.getElementById("covataForm");
    const covateContainer = document.getElementById("covateContainer");

    let pairs = [];
    let subjects = [];
    let currentCovataPair = null;

    // --- CARICAMENTO INIZIALE ---
    async function init() {
      // Carichiamo prima i soggetti così renderPairs li trova subito disponibili
      await loadSubjects();
      await loadPairs();
      await loadCovate();

      // Inizializza la prima riga uovo
      createEggRows();
    }

    // Carica Soggetti
    async function loadSubjects() {
      if (!db) return;
      const { data, error } = await db.from("subjects").select("*");
      if (!error && data) {
        subjects = data;
      }
    }

    function subjectById(id) {
      return subjects.find(s => String(s.id) === String(id)) || null;
    }

    // Carica Coppie
    async function loadPairs() {
      if (!db) return;
      const { data, error } = await db.from("coppie").select("*");
      if (error) {
        coppiaSelect.innerHTML = `<option value="">Errore nel caricamento</option>`;
        return;
      }
      pairs = data || [];
      renderPairs();
    }

    function renderPairs() {
      if (pairs.length === 0) {
        coppiaSelect.innerHTML = `<option value="">Nessuna coppia attiva trovata</option>`;
        return;
      }

      coppiaSelect.innerHTML = `<option value="">-- Seleziona una Coppia --</option>` +
        pairs.map(p => {
          const maschio = subjectById(p.maschio_id);
          const femmina = subjectById(p.femmina_id);
          const labelM = maschio ? (maschio.codice || maschio.anello || maschio.id) : p.maschio_id;
          const labelF = femmina ? (femmina.codice || femmina.anello || femmina.id) : p.femmina_id;
          return `<option value="${p.id}">♂ ${labelM} × ♀ ${labelF}</option>`;
        }).join("");
    }

    // --- GESTIONE DINAMICA RIGHE UOVA (PRESERVANDO I DATI ESISTENTI) ---
    function createEggRows() {
      const targetCount = Math.max(1, parseInt(numeroUova.value || "1", 10));
      const currentRows = [...eggList.querySelectorAll(".egg-row")];
      const currentCount = currentRows.length;
      const today = new Date().toISOString().slice(0, 10);

      // Aggiunge solo le righe mancanti
      if (targetCount > currentCount) {
        for (let i = currentCount + 1; i <= targetCount; i++) {
          const row = document.createElement("div");
          row.className = "egg-row";
          row.dataset.number = i;

          row.innerHTML = `
            <div class="egg-number">Uovo ${i}</div>
            <div>
              <label>Data deposizione *</label>
              <input type="date" class="egg-date" value="${today}" required>
            </div>
            <div>
              <label>Esito</label>
              <select class="egg-result">
                <option value="In attesa">In attesa</option>
                <option value="Fertile">Fertile</option>
                <option value="Chiaro">Chiaro</option>
                <option value="Rotto">Rotto</option>
                <option value="Perso">Perso</option>
                <option value="Schiuso">Schiuso</option>
              </select>
            </div>
            <div class="egg-hatch">
              <label>Data schiusa</label>
              <input type="date" class="egg-hatch-date">
            </div>
          `;

          eggList.appendChild(row);

          const result = row.querySelector(".egg-result");
          const hatch = row.querySelector(".egg-hatch");
          const hatchDate = row.querySelector(".egg-hatch-date");

          result.addEventListener("change", function () {
            if (this.value === "Schiuso") {
              hatch.classList.add("visible");
              if (!hatchDate.value) {
                hatchDate.value = new Date().toISOString().slice(0, 10);
              }
            } else {
              hatch.classList.remove("visible");
              hatchDate.value = "";
            }
          });
        }
      } 
      // Rimuove solo le righe in eccesso senza cancellare le prime
      else if (targetCount < currentCount) {
        for (let i = currentCount; i > targetCount; i--) {
          const rowToRemove = eggList.querySelector(`.egg-row[data-number="${i}"]`);
          if (rowToRemove) rowToRemove.remove();
        }
      }
    }

    // Ascolta sia 'change' che 'input' per reattività immediata sul campo numeroUova
    numeroUova.addEventListener("input", createEggRows);
    numeroUova.addEventListener("change", createEggRows);

    // --- SALVATAGGIO COVATA ---
    covataForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!db) return alert("Database non connesso");

      const coppiaId = coppiaSelect.value;
      const note = document.getElementById("noteCovata").value;
      if (!coppiaId) return alert("Seleziona una coppia");

      // Salva la Covata
      const { data: covataData, error: covataError } = await db
        .from("covate")
        .insert([{ coppia_id: coppiaId, note: note }])
        .select()
        .single();

      if (covataError) {
        alert("Errore nel salvataggio della covata: " + covataError.message);
        return;
      }

      // Estrai le informazioni su ogni uovo
      const eggRows = eggList.querySelectorAll(".egg-row");
      const eggsPayload = [];

      eggRows.forEach(row => {
        const dataDep = row.querySelector(".egg-date").value;
        const esito = row.querySelector(".egg-result").value;
        const dataSch = row.querySelector(".egg-hatch-date").value;

        eggsPayload.push({
          covata_id: covataData.id,
          data_deposizione: dataDep,
          esito: esito,
          data_schiusa: esito === "Schiuso" ? dataSch : null
        });
      });

      const { error: eggsError } = await db.from("uova").insert(eggsPayload);

      if (eggsError) {
        alert("Covata salvata, ma errore nel salvataggio uova: " + eggsError.message);
      } else {
        covataForm.reset();
        createEggRows();
        await loadCovate();
      }
    });

    // --- CARICAMENTO E RENDERING STORICO COVATE ---
    async function loadCovate() {
      if (!db) return;
      covateContainer.innerHTML = "Caricamento covate...";

      const { data: covate, error } = await db
        .from("covate")
        .select("*, uova(*)")
        .order("created_at", { ascending: false });

      if (error) {
        covateContainer.innerHTML = "Errore durante il recupero delle covate.";
        return;
      }

      if (!covate || covate.length === 0) {
        covateContainer.innerHTML = "<p style='color:var(--muted)'>Nessuna covata registrata.</p>";
        return;
      }

      covateContainer.innerHTML = covate.map(covata => {
        const coppia = pairs.find(p => String(p.id) === String(covata.coppia_id));
        const maschio = coppia ? subjectById(coppia.maschio_id) : null;
        const femmina = coppia ? subjectById(coppia.femmina_id) : null;
        
        const labelM = maschio ? (maschio.codice || maschio.anello) : "N/D";
        const labelF = femmina ? (femmina.codice || femmina.anello) : "N/D";

        const uovaList = (covata.uova || []).map((uovo, idx) => {
          const badgeClass = `badge-${uovo.esito.replace(" ", "-")}`;
          let hatchButton = "";

          if (uovo.esito === "Schiuso" && !uovo.soggetto_id) {
            hatchButton = `<button class="btn btn-small" onclick="openSubjectModal('${uovo.id}', '${covata.coppia_id}')">+ Crea Soggetto</button>`;
          } else if (uovo.soggetto_id) {
            hatchButton = `<span style="color:var(--accent); font-size:0.75rem;">✓ Soggetto Creato</span>`;
          }

          return `
            <div class="egg-badge ${badgeClass}">
              <span><strong>Uovo ${idx + 1}:</strong> ${uovo.esito}</span>
              <small>(${uovo.data_deposizione})</small>
              ${hatchButton}
            </div>
          `;
        }).join("");

        return `
          <div class="covata-item">
            <div class="covata-header">
              <div>
                <strong>Coppia:</strong> ♂ ${labelM} × ♀ ${labelF}
              </div>
              <button class="btn btn-danger btn-small" onclick="deleteCovata('${covata.id}')">Elimina</button>
            </div>
            ${covata.note ? `<p style="font-size:0.85rem; color:var(--muted); margin-bottom:8px;">Note: ${covata.note}</p>` : ''}
            <div class="egg-badge-list">
              ${uovaList || '<em>Nessun uovo censito</em>'}
            </div>
          </div>
        `;
      }).join("");
    }

    // --- MODALE CREAZIONE SOGGETTO DA SCHIUSA ---
    function openSubjectModal(eggId, pairId) {
      document.getElementById("subjectForm").reset();
      document.getElementById("subjectEggId").value = eggId;

      currentCovataPair = pairs.find(pair => String(pair.id) === String(pairId)) || null;

      // Pre-compilazione specie ereditaria se presente
      if (currentCovataPair) {
        const father = subjectById(currentCovataPair.maschio_id);
        const mother = subjectById(currentCovataPair.femmina_id);
        const specieDef = (father && father.specie) || (mother && mother.specie) || "";
        document.getElementById("subjectSpecie").value = specieDef;
      }

      document.getElementById("subjectData").value = new Date().toISOString().slice(0, 10);
      document.getElementById("subjectMessage").className = "status-message";
      document.getElementById("subjectMessage").textContent = "";

      document.getElementById("subjectModal").classList.add("show");
    }

    function closeSubjectModal() {
      document.getElementById("subjectModal").classList.remove("show");
    }

    document.getElementById("subjectForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const eggId = document.getElementById("subjectEggId").value;
      const codice = document.getElementById("subjectCodice").value;
      const specie = document.getElementById("subjectSpecie").value;
      const sesso = document.getElementById("subjectSesso").value;
      const dataNascita = document.getElementById("subjectData").value;
      const msgBox = document.getElementById("subjectMessage");

      if (!db) return;

      // Inserimento nuovo soggetto
      const newSubjectPayload = {
        codice: codice,
        specie: specie,
        sesso: sesso,
        data_nascita: dataNascita,
        padre_id: currentCovataPair ? currentCovataPair.maschio_id : null,
        madre_id: currentCovataPair ? currentCovataPair.femmina_id : null,
        stato: "In Allevamento"
      };

      const { data: newSub, error: subErr } = await db
        .from("subjects")
        .insert([newSubjectPayload])
        .select()
        .single();

      if (subErr) {
        msgBox.className = "status-message error";
        msgBox.textContent = "Errore creazione soggetto: " + subErr.message;
        return;
      }

      // Collegamento ID soggetto alla relativa uovo
      const { error: eggErr } = await db
        .from("uova")
        .update({ soggetto_id: newSub.id })
        .eq("id", eggId);

      if (eggErr) {
        msgBox.className = "status-message error";
        msgBox.textContent = "Soggetto creato, errore collegamento uovo: " + eggErr.message;
      } else {
        msgBox.className = "status-message success";
        msgBox.textContent = "Soggetto inserito e collegato con successo!";
        setTimeout(async () => {
          closeSubjectModal();
          await loadSubjects();
          await loadCovate();
        }, 1000);
      }
    });

    // --- ELIMINAZIONE COVATA ---
    async function deleteCovata(id) {
      if (!confirm("Sei sicuro di voler eliminare questa covata e tutte le sue uova?")) return;
      if (!db) return;

      const { error } = await db.from("covate").delete().eq("id", id);
      if (error) {
        alert("Errore durante l'eliminazione: " + error.message);
      } else {
        await loadCovate();
      }
    }

    // Avvio applicazione
    init();
  </script>
</body>
</html>
