<script>

  let client = null;
  let currentUser = null;
  let gabbie = [];


  /* =========================================================
     CLIENT SUPABASE
     ========================================================= */

  function getSupabaseClient() {

    if (window.supabaseClient) {
      return window.supabaseClient;
    }

    if (
      window.supabase &&
      typeof window.supabase.from === "function"
    ) {
      return window.supabase;
    }

    return null;
  }


  /* =========================================================
     MESSAGGI
     ========================================================= */

  function showMessage(text, type = "success") {

    const message = document.getElementById("message");

    message.textContent = text;
    message.className = "message " + type;

    clearTimeout(showMessage.timer);

    showMessage.timer = setTimeout(() => {
      message.textContent = "";
      message.className = "message";
    }, 5000);
  }


  /* =========================================================
     AUTENTICAZIONE
     ========================================================= */

  async function checkUser() {

    client = getSupabaseClient();

    if (!client) {

      showMessage(
        "Errore: client Supabase non trovato.",
        "error"
      );

      return false;
    }

    const { data, error } = await client.auth.getUser();

    if (error || !data || !data.user) {

      window.location.href = "index.html";
      return false;
    }

    currentUser = data.user;

    return true;
  }


  /* =========================================================
     CARICA GABBIE
     ========================================================= */

  async function loadGabbie() {

    const loading = document.getElementById("loading");
    const table = document.getElementById("gabbieTable");
    const emptyState = document.getElementById("emptyState");

    loading.style.display = "block";
    table.style.display = "none";
    emptyState.style.display = "none";

    const { data, error } = await client
      .from("gabbie")
      .select("id, user_id, numero, posizione, created_at")
      .eq("user_id", currentUser.id)
      .order("created_at", { ascending: false });

    if (error) {

      console.error("Errore caricamento gabbie:", error);

      loading.style.display = "none";

      showMessage(
        "Errore nel caricamento delle gabbie: " +
        error.message,
        "error"
      );

      return;
    }

    gabbie = data || [];

    updateStats();
    renderGabbie();

    loading.style.display = "none";
  }


  /* =========================================================
     STATISTICHE
     ========================================================= */

  function updateStats() {

    document.getElementById("totalGabbie").textContent =
      gabbie.length;

    if (gabbie.length === 0) {

      document.getElementById("lastGabbia").textContent = "—";

      return;
    }

    document.getElementById("lastGabbia").textContent =
      gabbie[0].numero || "—";
  }


  /* =========================================================
     FORMATTA DATA
     ========================================================= */

  function formatDate(value) {

    if (!value) {
      return "—";
    }

    const date = new Date(value);

    if (Number.isNaN(date.getTime())) {
      return "—";
    }

    return date.toLocaleDateString("it-IT", {
      day: "2-digit",
      month: "2-digit",
      year: "numeric"
    });
  }


  /* =========================================================
     SICUREZZA HTML
     ========================================================= */

  function escapeHtml(value) {

    if (value === null || value === undefined) {
      return "";
    }

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  /* =========================================================
     RENDER GABBIE
     ========================================================= */

  function renderGabbie() {

    const tbody = document.getElementById("gabbieBody");
    const table = document.getElementById("gabbieTable");
    const emptyState = document.getElementById("emptyState");

    const searchInput =
      document.getElementById("searchInput");

    const search =
      searchInput.value.trim().toLowerCase();

    const filtered = gabbie.filter(gabbia => {

      const numero =
        String(gabbia.numero || "").toLowerCase();

      const posizione =
        String(gabbia.posizione || "").toLowerCase();

      return (
        numero.includes(search) ||
        posizione.includes(search)
      );
    });

    tbody.innerHTML = "";


    if (filtered.length === 0) {

      table.style.display = "none";
      emptyState.style.display = "block";

      if (gabbie.length > 0 && search) {

        emptyState.querySelector("h3").textContent =
          "Nessun risultato";

        emptyState.querySelector("p").textContent =
          "Nessuna gabbia corrisponde alla ricerca.";

      } else {

        emptyState.querySelector("h3").textContent =
          "Nessuna gabbia presente";

        emptyState.querySelector("p").textContent =
          "Non hai ancora registrato nessuna gabbia. Utilizza il modulo qui sopra per aggiungere la prima.";
      }

      return;
    }


    emptyState.style.display = "none";
    table.style.display = "table";


    filtered.forEach(gabbia => {

      const tr = document.createElement("tr");

      const posizione = gabbia.posizione
        ? `<span class="position-text">${escapeHtml(gabbia.posizione)}</span>`
        : `<span class="position-empty">Non specificata</span>`;


      tr.innerHTML = `

        <td>
          <span class="cage-number">
            ${escapeHtml(gabbia.numero)}
          </span>
        </td>

        <td>
          ${posizione}
        </td>

        <td>
          <span class="created-date">
            ${formatDate(gabbia.created_at)}
          </span>
        </td>

        <td>
          <div class="actions">

            <button
              type="button"
              class="button button-secondary button-small"
              data-action="edit"
              data-id="${gabbia.id}"
            >
              Modifica
            </button>

            <button
              type="button"
              class="button button-danger button-small"
              data-action="delete"
              data-id="${gabbia.id}"
            >
              Elimina
            </button>

          </div>
        </td>

      `;

      tbody.appendChild(tr);
    });
  }


  /* =========================================================
     AGGIUNGI GABBIA
     ========================================================= */

  async function addGabbia(event) {

    event.preventDefault();

    const numeroInput =
      document.getElementById("numero");

    const posizioneInput =
      document.getElementById("posizione");

    const saveBtn =
      document.getElementById("saveBtn");

    const numero =
      numeroInput.value.trim();

    const posizione =
      posizioneInput.value.trim();


    if (!numero) {

      showMessage(
        "Inserisci il numero della gabbia.",
        "error"
      );

      numeroInput.focus();

      return;
    }


    saveBtn.disabled = true;
    saveBtn.textContent = "Salvataggio...";


    try {

      const { data, error } = await client
        .from("gabbie")
        .insert({
          user_id: currentUser.id,
          numero: numero,
          posizione: posizione || null
        })
        .select("id, user_id, numero, posizione, created_at")
        .single();


      if (error) {
        throw error;
      }


      gabbie.unshift(data);

      document
        .getElementById("gabbiaForm")
        .reset();

      updateStats();
      renderGabbie();

      showMessage(
        "Gabbia " + numero + " aggiunta correttamente."
      );

    } catch (error) {

      console.error("Errore inserimento:", error);

      showMessage(
        "Errore nel salvataggio della gabbia: " +
        error.message,
        "error"
      );

    } finally {

      saveBtn.disabled = false;
      saveBtn.textContent = "+ Aggiungi gabbia";
    }
  }


  /* =========================================================
     APRI MODIFICA
     ========================================================= */

  function openEditModal(id) {

    const gabbia =
      gabbie.find(item => String(item.id) === String(id));

    if (!gabbia) {
      return;
    }

    document.getElementById("editId").value =
      gabbia.id;

    document.getElementById("editNumero").value =
      gabbia.numero || "";

    document.getElementById("editPosizione").value =
      gabbia.posizione || "";

    document
      .getElementById("editModal")
      .classList.add("open");

    document
      .getElementById("editNumero")
      .focus();
  }


  /* =========================================================
     CHIUDI MODIFICA
     ========================================================= */

  function closeEditModal() {

    document
      .getElementById("editModal")
      .classList.remove("open");
  }


  /* =========================================================
     MODIFICA GABBIA
     ========================================================= */

  async function updateGabbia(event) {

    event.preventDefault();

    const id =
      document.getElementById("editId").value;

    const numero =
      document
        .getElementById("editNumero")
        .value
        .trim();

    const posizione =
      document
        .getElementById("editPosizione")
        .value
        .trim();

    const saveBtn =
      document.getElementById("editSaveBtn");


    if (!numero) {

      showMessage(
        "Inserisci il numero della gabbia.",
        "error"
      );

      return;
    }


    saveBtn.disabled = true;
    saveBtn.textContent = "Salvataggio...";


    try {

      const { data, error } = await client
        .from("gabbie")
        .update({
          numero: numero,
          posizione: posizione || null
        })
        .eq("id", id)
        .eq("user_id", currentUser.id)
        .select("id, user_id, numero, posizione, created_at")
        .single();


      if (error) {
        throw error;
      }


      const index = gabbie.findIndex(
        item => String(item.id) === String(id)
      );

      if (index !== -1) {
        gabbie[index] = data;
      }


      closeEditModal();

      updateStats();
      renderGabbie();

      showMessage(
        "Gabbia modificata correttamente."
      );

    } catch (error) {

      console.error("Errore modifica:", error);

      showMessage(
        "Errore nella modifica della gabbia: " +
        error.message,
        "error"
      );

    } finally {

      saveBtn.disabled = false;
      saveBtn.textContent = "Salva modifiche";
    }
  }


  /* =========================================================
     ELIMINA GABBIA
     ========================================================= */

  async function deleteGabbia(id) {

    const gabbia =
      gabbie.find(item => String(item.id) === String(id));

    if (!gabbia) {
      return;
    }


    const conferma = window.confirm(
      "Vuoi davvero eliminare la gabbia " +
      gabbia.numero +
      "?"
    );


    if (!conferma) {
      return;
    }


    try {

      const { error } = await client
        .from("gabbie")
        .delete()
        .eq("id", id)
        .eq("user_id", currentUser.id);


      if (error) {
        throw error;
      }


      gabbie = gabbie.filter(
        item => String(item.id) !== String(id)
      );

      updateStats();
      renderGabbie();

      showMessage(
        "Gabbia eliminata correttamente."
      );

    } catch (error) {

      console.error("Errore eliminazione:", error);

      showMessage(
        "Errore nell'eliminazione della gabbia: " +
        error.message,
        "error"
      );
    }
  }


  /* =========================================================
     EVENTI
     ========================================================= */

  document
    .getElementById("gabbiaForm")
    .addEventListener(
      "submit",
      addGabbia
    );


  document
    .getElementById("editForm")
    .addEventListener(
      "submit",
      updateGabbia
    );


  document
    .getElementById("cancelEditBtn")
    .addEventListener(
      "click",
      closeEditModal
    );


  document
    .getElementById("searchInput")
    .addEventListener(
      "input",
      renderGabbie
    );


  document
    .getElementById("gabbieBody")
    .addEventListener(
      "click",
      event => {

        const button =
          event.target.closest("button");

        if (!button) {
          return;
        }

        const id =
          button.dataset.id;

        const action =
          button.dataset.action;

        if (action === "edit") {
          openEditModal(id);
        }

        if (action === "delete") {
          deleteGabbia(id);
        }
      }
    );


  document
    .getElementById("editModal")
    .addEventListener(
      "click",
      event => {

        if (event.target.id === "editModal") {
          closeEditModal();
        }
      }
    );


  document.addEventListener(
    "keydown",
    event => {

      if (event.key === "Escape") {
        closeEditModal();
      }
    }
  );


  /* =========================================================
     LOGOUT
     ========================================================= */

  document
    .getElementById("logoutBtn")
    .addEventListener(
      "click",
      async () => {

        if (!client) {
          return;
        }

        await client.auth.signOut();

        window.location.href = "index.html";
      }
    );


  /* =========================================================
     AVVIO
     ========================================================= */

  (async function init() {

    const authenticated =
      await checkUser();

    if (!authenticated) {
      return;
    }

    await loadGabbie();

  })();

</script>
