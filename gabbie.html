<script>
(function () {

  "use strict";

  let appClient = null;
  let currentUser = null;
  let gabbie = [];


  /* =========================================================
     CLIENT SUPABASE
     Usa il client già creato da config.js / auth.js
     senza dichiarare nuovamente "client".
     ========================================================= */

  function getSupabaseClient() {

    if (
      typeof window.supabaseClient !== "undefined" &&
      window.supabaseClient
    ) {
      return window.supabaseClient;
    }

    if (
      typeof client !== "undefined" &&
      client
    ) {
      return client;
    }

    return null;
  }


  /* =========================================================
     MESSAGGI
     ========================================================= */

  function showMessage(text, type = "success") {

    const message =
      document.getElementById("message");

    if (!message) {
      return;
    }

    message.textContent = text;
    message.className = "message " + type;

    clearTimeout(showMessage.timer);

    showMessage.timer = setTimeout(function () {

      message.textContent = "";
      message.className = "message";

    }, 5000);
  }


  /* =========================================================
     AUTENTICAZIONE
     ========================================================= */

  async function checkUser() {

    appClient = getSupabaseClient();

    if (!appClient) {

      console.error(
        "Client Supabase non trovato."
      );

      showMessage(
        "Errore: client Supabase non trovato.",
        "error"
      );

      return false;
    }


    /*
     * Prima controlliamo la sessione attiva.
     */

    const {
      data: sessionData,
      error: sessionError
    } = await appClient.auth.getSession();


    if (sessionError) {

      console.error(
        "Errore recupero sessione:",
        sessionError
      );

      showMessage(
        "Errore nel recupero della sessione: " +
        sessionError.message,
        "error"
      );

      return false;
    }


    if (
      !sessionData ||
      !sessionData.session ||
      !sessionData.session.user
    ) {

      console.warn(
        "Nessuna sessione autenticata."
      );

      window.location.href = "index.html";

      return false;
    }


    currentUser =
      sessionData.session.user;


    console.log(
      "Utente autenticato:",
      currentUser.id
    );


    /*
     * Verifica aggiuntiva tramite getUser().
     */

    const {
      data: userData,
      error: userError
    } = await appClient.auth.getUser();


    if (
      userError ||
      !userData ||
      !userData.user
    ) {

      console.error(
        "Errore verifica utente:",
        userError
      );

      window.location.href = "index.html";

      return false;
    }


    currentUser =
      userData.user;


    console.log(
      "USER ID ALLEVANDO:",
      currentUser.id
    );


    return true;
  }


  /* =========================================================
     CARICAMENTO GABBIE
     ========================================================= */

  async function loadGabbie() {

    const loading =
      document.getElementById("loading");

    const table =
      document.getElementById("gabbieTable");

    const emptyState =
      document.getElementById("emptyState");


    if (loading) {
      loading.style.display = "block";
    }

    if (table) {
      table.style.display = "none";
    }

    if (emptyState) {
      emptyState.style.display = "none";
    }


    const {
      data,
      error
    } = await appClient

      .from("gabbie")

      .select(
        "id, user_id, numero, posizione, created_at"
      )

      .eq(
        "user_id",
        currentUser.id
      )

      .order(
        "created_at",
        {
          ascending: false
        }
      );


    if (error) {

      console.error(
        "Errore caricamento gabbie:",
        error
      );

      if (loading) {
        loading.style.display = "none";
      }

      showMessage(
        "Errore nel caricamento delle gabbie: " +
        error.message,
        "error"
      );

      return;
    }


    gabbie = data || [];


    updateStats();
    renderGabbie();


    if (loading) {
      loading.style.display = "none";
    }
  }


  /* =========================================================
     STATISTICHE
     ========================================================= */

  function updateStats() {

    const total =
      document.getElementById("totalGabbie");

    const last =
      document.getElementById("lastGabbia");


    if (total) {
      total.textContent =
        gabbie.length;
    }


    if (!last) {
      return;
    }


    if (gabbie.length === 0) {

      last.textContent = "—";

      return;
    }


    last.textContent =
      gabbie[0].numero || "—";
  }


  /* =========================================================
     DATA
     ========================================================= */

  function formatDate(value) {

    if (!value) {
      return "—";
    }


    const date =
      new Date(value);


    if (
      Number.isNaN(
        date.getTime()
      )
    ) {

      return "—";
    }


    return date.toLocaleDateString(
      "it-IT",
      {
        day: "2-digit",
        month: "2-digit",
        year: "numeric"
      }
    );
  }


  /* =========================================================
     ESCAPE HTML
     ========================================================= */

  function escapeHtml(value) {

    if (
      value === null ||
      value === undefined
    ) {

      return "";
    }


    return String(value)

      .replace(/&/g, "&amp;")

      .replace(/</g, "&lt;")

      .replace(/>/g, "&gt;")

      .replace(/"/g, "&quot;")

      .replace(/'/g, "&#039;");
  }


  /* =========================================================
     RENDER GABBIE
     ========================================================= */

  function renderGabbie() {

    const tbody =
      document.getElementById("gabbieBody");

    const table =
      document.getElementById("gabbieTable");

    const emptyState =
      document.getElementById("emptyState");

    const searchInput =
      document.getElementById("searchInput");


    if (
      !tbody ||
      !table ||
      !emptyState
    ) {
      return;
    }


    const search =
      searchInput
        ? searchInput.value
            .trim()
            .toLowerCase()
        : "";


    const filtered =
      gabbie.filter(function (gabbia) {

        const numero =
          String(
            gabbia.numero || ""
          ).toLowerCase();


        const posizione =
          String(
            gabbia.posizione || ""
          ).toLowerCase();


        return (
          numero.includes(search) ||
          posizione.includes(search)
        );

      });


    tbody.innerHTML = "";


    if (filtered.length === 0) {

      table.style.display = "none";
      emptyState.style.display = "block";


      const title =
        emptyState.querySelector("h3");

      const description =
        emptyState.querySelector("p");


      if (
        gabbie.length > 0 &&
        search
      ) {

        if (title) {
          title.textContent =
            "Nessun risultato";
        }

        if (description) {
          description.textContent =
            "Nessuna gabbia corrisponde alla ricerca.";
        }

      } else {

        if (title) {
          title.textContent =
            "Nessuna gabbia presente";
        }

        if (description) {
          description.textContent =
            "Non hai ancora registrato nessuna gabbia. Utilizza il modulo qui sopra per aggiungere la prima.";
        }
      }


      return;
    }


    emptyState.style.display = "none";
    table.style.display = "table";


    filtered.forEach(function (gabbia) {

      const tr =
        document.createElement("tr");


      const posizione =
        gabbia.posizione

          ? `
              <span class="position-text">
                ${escapeHtml(gabbia.posizione)}
              </span>
            `

          : `
              <span class="position-empty">
                Non specificata
              </span>
            `;


      tr.innerHTML = `

        <td>
          <span class="cage-number">
            ${escapeHtml(gabbia.numero)}
          </span>
        </td>

        <td>
          ${posizione}
        </td>

        <td>
          <span class="created-date">
            ${formatDate(gabbia.created_at)}
          </span>
        </td>

        <td>

          <div class="actions">

            <button
              type="button"
              class="button button-secondary button-small"
              data-action="edit"
              data-id="${escapeHtml(gabbia.id)}"
            >
              Modifica
            </button>

            <button
              type="button"
              class="button button-danger button-small"
              data-action="delete"
              data-id="${escapeHtml(gabbia.id)}"
            >
              Elimina
            </button>

          </div>

        </td>

      `;


      tbody.appendChild(tr);

    });
  }


  /* =========================================================
     AGGIUNTA GABBIA
     ========================================================= */

  async function addGabbia(event) {

    event.preventDefault();


    if (!appClient || !currentUser) {

      showMessage(
        "Sessione non disponibile. Ricarica la pagina.",
        "error"
      );

      return;
    }


    const numeroInput =
      document.getElementById("numero");

    const posizioneInput =
      document.getElementById("posizione");

    const saveBtn =
      document.getElementById("saveBtn");


    const numero =
      numeroInput.value.trim();

    const posizione =
      posizioneInput.value.trim();


    if (!numero) {

      showMessage(
        "Inserisci il numero della gabbia.",
        "error"
      );

      numeroInput.focus();

      return;
    }


    saveBtn.disabled = true;
    saveBtn.textContent = "Salvataggio...";


    try {

      /*
       * IMPORTANTE:
       * user_id viene preso direttamente dall'utente
       * autenticato nella sessione Supabase.
       */

      const userId =
        currentUser.id;


      console.log(
        "Inserimento gabbia:",
        {
          user_id: userId,
          numero: numero,
          posizione: posizione || null
        }
      );


      const {
        data,
        error
      } = await appClient

        .from("gabbie")

        .insert([
          {
            user_id: userId,
            numero: numero,
            posizione: posizione || null
          }
        ])

        .select(
          "id, user_id, numero, posizione, created_at"
        )

        .single();


      if (error) {

        console.error(
          "Errore inserimento gabbia:",
          error
        );

        throw error;
      }


      console.log(
        "Gabbia salvata:",
        data
      );


      gabbie.unshift(data);


      document
        .getElementById("gabbiaForm")
        .reset();


      updateStats();
      renderGabbie();


      showMessage(
        "Gabbia " +
        numero +
        " aggiunta correttamente."
      );


    } catch (error) {

      console.error(
        "Errore inserimento:",
        error
      );


      showMessage(
        "Errore nel salvataggio della gabbia: " +
        error.message,
        "error"
      );


    } finally {

      saveBtn.disabled = false;
      saveBtn.textContent =
        "+ Aggiungi gabbia";
    }
  }


  /* =========================================================
     APRI MODIFICA
     ========================================================= */

  function openEditModal(id) {

    const gabbia =
      gabbie.find(function (item) {

        return String(item.id) ===
          String(id);

      });


    if (!gabbia) {
      return;
    }


    document.getElementById("editId").value =
      gabbia.id;


    document.getElementById("editNumero").value =
      gabbia.numero || "";


    document.getElementById("editPosizione").value =
      gabbia.posizione || "";


    document
      .getElementById("editModal")
      .classList.add("open");


    document
      .getElementById("editNumero")
      .focus();
  }


  /* =========================================================
     CHIUDI MODALE
     ========================================================= */

  function closeEditModal() {

    const modal =
      document.getElementById("editModal");


    if (modal) {
      modal.classList.remove("open");
    }
  }


  /* =========================================================
     MODIFICA GABBIA
     ========================================================= */

  async function updateGabbia(event) {

    event.preventDefault();


    if (!appClient || !currentUser) {

      showMessage(
        "Sessione non disponibile. Ricarica la pagina.",
        "error"
      );

      return;
    }


    const id =
      document.getElementById("editId").value;

    const numero =
      document
        .getElementById("editNumero")
        .value
        .trim();

    const posizione =
      document
        .getElementById("editPosizione")
        .value
        .trim();

    const saveBtn =
      document.getElementById("editSaveBtn");


    if (!numero) {

      showMessage(
        "Inserisci il numero della gabbia.",
        "error"
      );

      return;
    }


    saveBtn.disabled = true;
    saveBtn.textContent = "Salvataggio...";


    try {

      const {
        data,
        error
      } = await appClient

        .from("gabbie")

        .update({
          numero: numero,
          posizione: posizione || null
        })

        .eq("id", id)

        .eq(
          "user_id",
          currentUser.id
        )

        .select(
          "id, user_id, numero, posizione, created_at"
        )

        .single();


      if (error) {
        throw error;
      }


      const index =
        gabbie.findIndex(function (item) {

          return String(item.id) ===
            String(id);

        });


      if (index !== -1) {
        gabbie[index] = data;
      }


      closeEditModal();

      updateStats();
      renderGabbie();


      showMessage(
        "Gabbia modificata correttamente."
      );


    } catch (error) {

      console.error(
        "Errore modifica:",
        error
      );


      showMessage(
        "Errore nella modifica della gabbia: " +
        error.message,
        "error"
      );


    } finally {

      saveBtn.disabled = false;
      saveBtn.textContent =
        "Salva modifiche";
    }
  }


  /* =========================================================
     ELIMINA GABBIA
     ========================================================= */

  async function deleteGabbia(id) {

    if (!appClient || !currentUser) {

      showMessage(
        "Sessione non disponibile. Ricarica la pagina.",
        "error"
      );

      return;
    }


    const gabbia =
      gabbie.find(function (item) {

        return String(item.id) ===
          String(id);

      });


    if (!gabbia) {
      return;
    }


    const conferma =
      window.confirm(
        "Vuoi davvero eliminare la gabbia " +
        gabbia.numero +
        "?"
      );


    if (!conferma) {
      return;
    }


    try {

      const {
        error
      } = await appClient

        .from("gabbie")

        .delete()

        .eq("id", id)

        .eq(
          "user_id",
          currentUser.id
        );


      if (error) {
        throw error;
      }


      gabbie =
        gabbie.filter(function (item) {

          return String(item.id) !==
            String(id);

        });


      updateStats();
      renderGabbie();


      showMessage(
        "Gabbia eliminata correttamente."
      );


    } catch (error) {

      console.error(
        "Errore eliminazione:",
        error
      );


      showMessage(
        "Errore nell'eliminazione della gabbia: " +
        error.message,
        "error"
      );
    }
  }


  /* =========================================================
     AVVIO PAGINA
     ========================================================= */

  document.addEventListener(
    "DOMContentLoaded",
    async function () {

      /*
       * FORM NUOVA GABBIA
       */

      const gabbiaForm =
        document.getElementById(
          "gabbiaForm"
        );


      if (gabbiaForm) {

        gabbiaForm.addEventListener(
          "submit",
          addGabbia
        );
      }


      /*
       * FORM MODIFICA
       */

      const editForm =
        document.getElementById(
          "editForm"
        );


      if (editForm) {

        editForm.addEventListener(
          "submit",
          updateGabbia
        );
      }


      /*
       * ANNULLA MODIFICA
       */

      const cancelEditBtn =
        document.getElementById(
          "cancelEditBtn"
        );


      if (cancelEditBtn) {

        cancelEditBtn.addEventListener(
          "click",
          closeEditModal
        );
      }


      /*
       * RICERCA
       */

      const searchInput =
        document.getElementById(
          "searchInput"
        );


      if (searchInput) {

        searchInput.addEventListener(
          "input",
          renderGabbie
        );
      }


      /*
       * AZIONI TABELLA
       */

      const gabbieBody =
        document.getElementById(
          "gabbieBody"
        );


      if (gabbieBody) {

        gabbieBody.addEventListener(
          "click",
          function (event) {

            const button =
              event.target.closest(
                "button"
              );


            if (!button) {
              return;
            }


            const id =
              button.dataset.id;

            const action =
              button.dataset.action;


            if (action === "edit") {

              openEditModal(id);
            }


            if (action === "delete") {

              deleteGabbia(id);
            }

          }
        );
      }


      /*
       * CHIUSURA MODALE
       */

      const editModal =
        document.getElementById(
          "editModal"
        );


      if (editModal) {

        editModal.addEventListener(
          "click",
          function (event) {

            if (
              event.target ===
              editModal
            ) {

              closeEditModal();
            }

          }
        );
      }


      /*
       * TASTO ESC
       */

      document.addEventListener(
        "keydown",
        function (event) {

          if (
            event.key ===
            "Escape"
          ) {

            closeEditModal();
          }

        }
      );


      /*
       * LOGOUT
       */

      const logoutBtn =
        document.getElementById(
          "logoutBtn"
        );


      if (logoutBtn) {

        logoutBtn.addEventListener(
          "click",
          async function () {

            if (!appClient) {
              return;
            }


            await appClient.auth.signOut();


            window.location.href =
              "index.html";
          }
        );
      }


      /*
       * AUTENTICAZIONE
       */

      const authenticated =
        await checkUser();


      if (!authenticated) {
        return;
      }


      /*
       * CARICAMENTO
       */

      await loadGabbie();

    }
  );

})();
</script>
